   name: keep-supabase-awake
   on:
     schedule:
       - cron: '0 6 */2 * *'
     workflow_dispatch:
   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - run: curl -fsS "$SUPABASE_URL/rest/v1/targets?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY"
           env:
             SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
             SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
